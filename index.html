<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinesio Calculadora</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#00796b">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">
    <h1>Kinesio Calculadora 🫁</h1>
    
    <div class="form-group">
        <label for="calculo">Selecciona el cálculo que deseas realizar:</label>
        <select id="calculo" onchange="mostrarCalculo()">
            <option value="">-- Selecciona una opción --</option>
            <option value="primer-calculo">Fentanilo</option>
            <option value="segundo-calculo">Propofol</option>
            <option value="tercer-calculo">Midazolan</option>
            <option value="cuarto-calculo">Noradrenalina</option>
        </select>
        <!-- <button onclick="mostrarCalculo()">Elegir</button> -->
    </div>

    <div id="primer-calculo">
        <!-- Ejemplo de entrada: Parámetros para un cálculo básico -->
            <div class="form-group">
                <label for="param1">Frecuencia Respiratoria (rpm):</label>
                <input type="number" id="param1" placeholder="Ej. 12" value="12">
            </div>
            
            <div class="form-group">
                <label for="param2">Volumen Corriente (mL):</label>
                <input type="number" id="param2" placeholder="Ej. 500" value="500">
            </div>

            <button onclick="calcular()">Calcular Volumen Minuto</button>

            <div id="resultado" class="result"></div>
        </div>
    </div>

    <div id="segundo-calculo">
        <p>Contenido del segundo cálculo.</p>
    </div>

    <div id="tercer-calculo">
        <p>Contenido del tercer cálculo.</p>
    </div>

    <div id="cuarto-calculo">
        <p>Contenido del cuarto cálculo.</p>
    </div>    
    
</body>
</html>
